name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Native app, frontend, MCP and package guards
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          $toolchain = Get-Content -Raw rust-toolchain.toml
          if ($toolchain -notmatch '(?m)^channel\s*=\s*"1\.99\.1"\s*$') {
            throw 'CI expects exact Rust 1.99.1 in rust-toolchain.toml; update the workflow deliberately when changing it.'
          }
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
          rustc --version
          if ($LASTEXITCODE -ne 0) { throw 'The repository Rust toolchain is unavailable.' }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.0'
          cache: npm

      - name: Install frontend dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          npm ci

      - name: Check TypeScript
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          npm run typecheck

      - name: Test user interface
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          npm run test:ui

      - name: Build frontend
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          npm run build

      - name: Prepare production sidecars before workspace compilation
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          ./scripts/prepare-sidecars.ps1 -Profile Debug

      - name: Check package guards without executing fixtures
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          ./scripts/test-package.ps1

      - name: Check Rust formatting
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          cargo fmt --all -- --check

      - name: Lint Rust workspace
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          cargo test --workspace --locked

      - name: Test MCP protocol using test data
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          npm run test:mcp

      - name: Build native application with production sidecars
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          cargo build --locked --target x86_64-pc-windows-msvc --package bootpilot-app --bin bootpilot

      - name: Verify production CLI and MCP without source working directory
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          ./scripts/verify-package.ps1 -PackageRoot (Join-Path $env:GITHUB_WORKSPACE 'target/x86_64-pc-windows-msvc/debug')

      - name: Build unsigned preview packages for acceptance
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          $directory = Join-Path $env:RUNNER_TEMP 'bootpilot-preview'
          pwsh -NoProfile -File ./scripts/package.ps1 -OutputDirectory $directory
          if ($LASTEXITCODE -ne 0) { throw 'Preview packaging failed.' }

      - name: Validate preview asset names and create checksums
        id: preview
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          $ErrorActionPreference = 'Stop'
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [Console]::OutputEncoding
          . ./scripts/package-common.ps1
          $version = (Get-BootPilotBuildMetadata).Version
          $directory = Join-Path $env:RUNNER_TEMP 'bootpilot-preview'
          $expected = @("BootPilot-$version-windows-x64-setup.exe", "BootPilot-$version-windows-x64.zip")
          $items = @(Get-ChildItem -LiteralPath $directory -Force)
          if ($items.Count -ne 2 -or @($items | Where-Object { $_.PSIsContainer -or $_.Length -eq 0 -or $_.Name -cnotin $expected }).Count -ne 0) { throw 'Preview requires exactly the two named, nonempty assets.' }
          Assert-PortableArchive (Join-Path $directory $expected[1])
          $checksums = foreach ($name in $expected) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $directory $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $directory 'SHA256SUMS.txt') -Encoding utf8NoBOM
          "directory=$directory" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned acceptance packages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-preview
          path: ${{ steps.preview.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 7
