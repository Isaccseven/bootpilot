[package]
name = "boot-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
boot-core = { path = "../boot-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
wmi = "=0.18.4"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WindowsProgramming", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_RemoteDesktop"] }

[dev-dependencies]
tempfile = "3"
