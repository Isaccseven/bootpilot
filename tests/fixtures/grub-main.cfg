# untouched
set default=0
set timeout=30
menuentry 'Windows' {
  chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
menuentry 'Unknown utility' {
  echo 'literal { braces }'; reboot
}
# start-grub2win-user-section ********
set timeout_style=menu
set timeout=45
menuentry 'Installer' --id=installer {
  echo legacy
}
menuentry 'Fallback' --id=fallback {
  chainloader /EFI/old.efi
}
# end-grub2win-user-section ********
